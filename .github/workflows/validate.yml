name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate shared packaging
        run: python3 scripts/validate.py
      - name: Validate Claude marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.223 plugin validate .
